name: Daily training snippet

on:
  schedule:
    # 07:15 UTC = 08:15 Irish summer time / 07:15 winter
    - cron: '15 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publish today's quiz data (before the email lands)
        run: |
          node scripts/daily-snippet.mjs --dry-run
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add today.json
          git diff --cached --quiet || { git commit -m "today.json $(date -u +%F)"; git push; }
      - name: Send today's snippet
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/daily-snippet.mjs
